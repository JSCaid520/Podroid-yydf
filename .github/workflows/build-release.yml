name: build-release

# Every push to main builds a signed release APK and publishes it as a GitHub
# Release. Pushes come from the fork-sync container (upstream merge) or from a
# human; no scheduled run here - the container owns the upstream polling.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload_tag:
        description: 'Upstream release tag to take the VM payload from (blank = latest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Never cancel a build in flight: a cancelled run means no release, and the
  # download notification is sent only for releases that actually exist.
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ExTV/Podroid
  # Committed on purpose: CI must sign with the SAME key on every build or the
  # APK stops installing over the previous one. It is not a confidential secret
  # (this repository is public), it is an identity - treat it as replaceable
  # only together with a one-time uninstall on the device.
  STORE_FILE: .github/podroid-release.jks
  STORE_PASSWORD: podroid2026
  KEY_ALIAS: podroid
  KEY_PASSWORD: podroid2026

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          CODE=$(date -u +%s)
          NAME="1.3.0-${GITHUB_RUN_NUMBER}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          # Use the runner's preinstalled SDK. android-actions/setup-android@v3
          # crashes on this image (its bundled sdkmanager dies during --licenses),
          # and AGP can fetch the platform/build-tools/NDK itself once the
          # licences are accepted.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" > /dev/null 2>&1 || true
          echo "sdk root: $SDK"
          ls "$SDK"

      - name: Fetch VM payload from the upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_TAG: ${{ inputs.payload_tag }}
        run: |
          set -euo pipefail
          # The QEMU binaries, kernel, initrd and the ~225 MB rootfs squashfs are
          # gitignored in this repo: upstream builds them locally and ships them
          # only inside its release APK. So take them from that APK, byte for byte,
          # instead of rebuilding a kernel (an hour of CI) on every commit.
          if [ -n "${PAYLOAD_TAG:-}" ]; then
            API="https://api.github.com/repos/${UPSTREAM_REPO}/releases/tags/${PAYLOAD_TAG}"
          else
            API="https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest"
          fi
          REL=$(curl -sSL -H "Authorization: token ${GH_TOKEN}" "$API")
          URL=$(printf '%s' "$REL" | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.apk')][0])")
          TAG=$(printf '%s' "$REL" | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "payload source: ${UPSTREAM_REPO} ${TAG}"
          echo "payload url: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          curl -sSL --retry 4 --retry-delay 5 -o /tmp/payload.apk "$URL"
          ls -l /tmp/payload.apk
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          unzip -o -j /tmp/payload.apk 'lib/arm64-v8a/*' -d app/src/main/jniLibs/arm64-v8a
          unzip -o -j /tmp/payload.apk 'assets/vmlinuz-virt' 'assets/initrd.img' 'assets/alpine-rootfs.squashfs' -d app/src/main/assets
          echo "PAYLOAD_TAG_USED=${TAG}" >> "$GITHUB_ENV"
          ls -l app/src/main/jniLibs/arm64-v8a
          ls -l app/src/main/assets/vmlinuz-virt app/src/main/assets/initrd.img app/src/main/assets/alpine-rootfs.squashfs
          # Hard stop if a payload file is missing: shipping an APK without the
          # VM inside installs fine and then cannot boot anything.
          for f in app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so \
                   app/src/main/jniLibs/arm64-v8a/libslirp.so \
                   app/src/main/jniLibs/arm64-v8a/libpodroid-bridge.so \
                   app/src/main/assets/vmlinuz-virt \
                   app/src/main/assets/initrd.img \
                   app/src/main/assets/alpine-rootfs.squashfs; do
            [ -s "$f" ] || { echo "MISSING PAYLOAD: $f"; exit 1; }
          done

      - name: Splice our config into the VM payload
        run: |
          set -euo pipefail
          # The rootfs squashfs above comes from the UPSTREAM release APK, so
          # anything we add under build-rootfs/files/ never reaches it. Splice
          # our files into the squashfs instead, repacking with the exact options
          # upstream's Dockerfile.rootfs uses.
          #
          # Runs as root on purpose: newuidmap/newgidmap carry a
          # security.capability xattr that rootless Podman needs, and only root
          # can read/restore that xattr during unpack+repack.
          SQUASH=app/src/main/assets/alpine-rootfs.squashfs
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          echo "compressor: $(unsquashfs -s "$SQUASH" | sed -n 's/^Compression \([a-z]*\).*/\1/p' | head -1)"
          sudo unsquashfs -q -d /tmp/rootfs "$SQUASH"
          BEFORE=$(sudo find /tmp/rootfs | wc -l)
          sudo install -D -m0644 -o root -g root \
            build-rootfs/files/etc/docker/daemon.json \
            /tmp/rootfs/etc/docker/daemon.json
          sudo install -D -m0644 -o root -g root \
            build-rootfs/files/etc/containers/registries.conf.d/85-podroid-mirrors.conf \
            /tmp/rootfs/etc/containers/registries.conf.d/85-podroid-mirrors.conf
          # podroid-backup must support both engines (the image ships podman and
          # docker); keep the image's copy in sync with the repo, as the upstream
          # squashfs has the podman-only version.
          sudo install -D -m0755 -o root -g root \
            build-rootfs/files/usr/local/bin/podroid-backup \
            /tmp/rootfs/usr/local/bin/podroid-backup
          rm -f "$SQUASH"
          sudo mksquashfs /tmp/rootfs "$SQUASH" \
            -comp zstd -Xcompression-level 19 -all-root -noappend -no-progress
          ls -l "$SQUASH"
          echo "entries before=${BEFORE} after=$(unsquashfs -l "$SQUASH" | wc -l)"
          # Fail the build rather than ship a VM whose mirrors are missing.
          unsquashfs -cat "$SQUASH" etc/docker/daemon.json > /tmp/daemon.json
          unsquashfs -cat "$SQUASH" etc/containers/registries.conf.d/85-podroid-mirrors.conf > /tmp/mirrors.conf
          grep -q 'docker.1ms.run' /tmp/daemon.json
          grep -q 'docker.1ms.run' /tmp/mirrors.conf
          # ...or whose backup tool only knows podman.
          unsquashfs -cat "$SQUASH" usr/local/bin/podroid-backup > /tmp/podroid-backup
          grep -q 'installed_engines' /tmp/podroid-backup
          grep -q 'docker) docker export' /tmp/podroid-backup
          unsquashfs -lls "$SQUASH" usr/local/bin/podroid-backup | tee -a "$GITHUB_STEP_SUMMARY"
          unsquashfs -lls "$SQUASH" usr/local/bin/podroid-backup | grep -q '^-rwxr-xr-x'
          # Capability xattrs must survive the repack or rootless Podman breaks.
          sudo unsquashfs -q -d /tmp/verify "$SQUASH" usr/bin/newuidmap
          sudo getcap /tmp/verify/usr/bin/newuidmap | tee -a "$GITHUB_STEP_SUMMARY"
          sudo getcap /tmp/verify/usr/bin/newuidmap | grep -q cap_setuid
          {
            echo '### Registry mirrors baked into the VM payload'
            echo '```'
            cat /tmp/daemon.json
            echo '```'
            echo '### podroid-backup supports podman + docker'
            echo '```'
            grep -n 'ENGINES=' /tmp/podroid-backup
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release APK
        env:
          PODROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          PODROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PPODROID_RELEASE_STORE_FILE="$GITHUB_WORKSPACE/$STORE_FILE" \
            -PPODROID_RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PPODROID_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PPODROID_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify and stage the APK
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/app-release.apk
          [ -s "$SRC" ] || { echo "no release APK produced"; exit 1; }
          OUT="Podroid-${{ steps.ver.outputs.tag }}-release.apk"
          cp "$SRC" "/tmp/$OUT"
          # The signature must be ours, not a debug fallback: a debug-signed
          # "release" would fail to install over the previous build. Pick one
          # apksigner explicitly - the runner ships build-tools 35 while the
          # build pulls 36, and an unquoted glob then feeds one binary to the
          # other ("Unsupported command: ...").
          APKSIGNER=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          CERTS=$("$APKSIGNER" verify --print-certs "/tmp/$OUT")
          echo "$CERTS" | head -6
          echo "$CERTS" | grep -q "CN=Podroid" || { echo "APK is not signed with the Podroid release key"; exit 1; }
          echo "size=$(stat -c %s "/tmp/$OUT")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "/tmp/$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=/tmp/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "/tmp/$OUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          NAME="${{ steps.apk.outputs.name }}"
          cat > /tmp/notes.md <<EOF
          Podroid fork build ${TAG}

          - versionName: ${{ steps.ver.outputs.name }}
          - versionCode: ${{ steps.ver.outputs.code }}
          - commit: ${GITHUB_SHA}
          - VM payload taken from upstream release: ${PAYLOAD_TAG_USED}
          - sha256: ${{ steps.apk.outputs.sha256 }}

          Local changes on top of upstream:
          - status bubble (SYSTEM_ALERT_WINDOW) with start/stop, forward replay,
            copy-status and hide actions
          - the VM now survives swiping the app out of recents, and an unexpected
            exit is retried up to 3 times
          EOF
          gh release create "$TAG" "/tmp/$NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file /tmp/notes.md
