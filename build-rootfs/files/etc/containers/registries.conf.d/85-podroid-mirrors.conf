# Podroid: pull Docker Hub images through public mirrors by default.
#
# Without this, `podman pull nginx` in the VM talks to registry-1.docker.io
# directly, which is slow or unreachable from many networks (mainland China
# especially). These are pull-through mirrors, so image content and digests
# are unchanged - only the host that serves the blobs differs.
#
# Podman tries the mirrors in order and falls back to docker.io when all of
# them fail, so a dead mirror never blocks a pull.
#
# Note: this file only adds a [[registry]] block; the stock Alpine
# /etc/containers/registries.conf still provides unqualified-search-registries
# so bare names (`nginx`) keep resolving to docker.io.

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "docker.1ms.run"

[[registry.mirror]]
location = "hub.rat.dev"

[[registry.mirror]]
location = "docker.m.daocloud.io"
